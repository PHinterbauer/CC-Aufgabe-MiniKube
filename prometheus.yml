global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scrapes itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Scrape FastAPI metrics
  - job_name: "server"
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8000"]
